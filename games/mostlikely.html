<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Most Likely To · Parlor</title>
<meta name="theme-color" content="#14111f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/parlor.css">
<style>
.pre{font-family:var(--display);font-style:italic;font-weight:700;color:var(--mute);font-size:22px}
.q{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.5vw,46px);line-height:1.08;text-wrap:balance}
.yb{display:grid;gap:10px;text-align:left}
.yb .p{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;border-left:6px solid var(--sc)}
.yb .p b{font-family:var(--display);font-size:20px}
.yb .p li{color:var(--mute);font-size:15px}
.yb .p ul{margin:6px 0 0;padding-left:18px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="../assets/data/mostlikely.js"></script>
<script src="../assets/js/parlor.js"></script>
<script>
const app = GN.page({ title:"Most Likely To", accent:"#ff8fab", accentInk:"#33040f" });
const PROMPTS = (window.GN_DATA && GN_DATA.mostlikely) || [];
const cfg = Object.assign({ rounds:12, predict:true }, GN.get("mostlikely.cfg", {}));
const save = () => GN.set("mostlikely.cfg", cfg);
let G = null;

function setup(){
  GN.render(`<div class="stack">
    <div><div class="kicker">Affectionate roasting</div><h1>Most Likely To</h1>
    <p class="lede">“Who's most likely to accidentally join a cult?” On three, everyone points. Score by reading the room, and leave with a yearbook of superlatives.</p></div>
    <div id="roster"></div>
    <div class="card">
      <h3>Settings</h3>
      <div class="setting"><div class="lab">Prompts</div>${GN.seg("rounds", [8, 12, 16, 20], cfg.rounds)}</div>
      <div class="setting"><div class="lab">🔮 Hot seat prediction<small>Each round one person secretly predicts the winner first. If they're right, +2.</small></div>${GN.seg("predict", [true, false], cfg.predict, v => v ? "On" : "Off")}</div>
    </div>
    <button class="btn primary big block" id="go" ${GN.roster().players.length < 4 ? "disabled" : ""}>Start</button>
    <details class="card rules"><summary>Rules</summary>
      <ol>
        <li>Read the prompt aloud. ${cfg.predict ? "The hot-seat player has already made a secret prediction. " : ""}On three, everyone points at someone. You can't point at yourself.</li>
        <li>Count fingers and tap whoever got the most. That person wins the superlative and it goes in the yearbook.</li>
        <li>Everyone who pointed at the winner scores <b>1</b>. That's reading the room.</li>
        <li>Ties: tap one winner, or skip the round if it's a mess.</li>
        <li>Keep it affectionate. ${PROMPTS.length} prompts.</li>
      </ol>
      ${GN.isPairs() ? `<p>Pointing is individual. Points go to each player's team.</p>` : ""}
    </details>
  </div>`);
  GN.rosterBlock(GN.$("#roster"), { onChange:setup });
  GN.bindSegs(app, cfg, () => { save(); setup(); });
  GN.$("#go").onclick = start;
}
function start(){
  const players = GN.roster().players; if (players.length < 4) return;
  const sides = GN.sides();
  G = { players, sides, scores:sides.map(() => 0), n:0, book:{}, dealer:GN.dealer("mostlikely", PROMPTS) };
  GN._wantWake = true; GN.wake(true);
  next();
}
function award(p, n){ const s = GN.sideOfPlayer(G.sides, p); G.scores[G.sides.indexOf(s)] += n; }
function next(){
  if (G.n >= cfg.rounds) return yearbook();
  const P = G.dealer.next(); const seer = G.players[G.n % G.players.length];
  const R = { P, seer, pred:null };
  if (cfg.predict) GN.handoff({ to:seer, color:GN.color(G.players.indexOf(seer)), emoji:"🔮", msg:"You're in the hot seat. Read the prompt privately and predict who the room will pick.", button:"Show me the prompt", onReady:() => predict(R) });
  else show(R);
}
function predict(R){
  const draw = () => {
    GN.stage(`<div class="wrap" style="width:100%">
      <div class="kicker">${GN.esc(R.seer)} only</div><div class="pre" style="margin-top:12px">Who's most likely to…</div><div class="q" style="margin:6px 0 16px">${GN.esc(R.P)}?</div>
      <div class="sidegrid">${G.players.map((p, i) => `<button class="sidebtn" data-p="${GN.esc(p)}" style="--sc:${GN.color(i)}" aria-pressed="${R.pred === p}">${GN.esc(p)}</button>`).join("")}</div>
      <div class="btns"><button class="btn primary big" id="ok" ${R.pred ? "" : "disabled"}>Lock prediction 🔒</button></div></div>`);
    GN.$$("[data-p]").forEach(b => b.onclick = () => { R.pred = b.dataset.p; GN.sfx.tap(); draw(); });
    GN.$("#ok").onclick = () => show(R);
  };
  draw();
}
function show(R){
  GN.stage(`<div class="wrap" style="width:100%">
    <div class="kicker">${G.n + 1} of ${cfg.rounds}</div>
    <div class="pre" style="margin-top:18px">Who's most likely to…</div><div class="q" style="margin:8px 0 22px">${GN.esc(R.P)}?</div>
    ${cfg.predict ? `<p class="muted">🔮 ${GN.esc(R.seer)} has a secret prediction.</p>` : ""}
    <div class="btns"><button class="btn primary big" id="ok">Point on three!</button><button class="btn ghost" id="skip">Skip this one</button></div></div>`);
  GN.$("#ok").onclick = () => GN.countdown("Point!", "", () => pickWinner(R));
  GN.$("#skip").onclick = () => { R.P = G.dealer.next(); show(R); };
}
function pickWinner(R){
  let win = null; const pointers = new Set();
  const draw = () => {
    GN.stage(`<div class="wrap" style="width:100%">
      <div class="small muted">…${GN.esc(R.P)}</div>
      <h2 style="margin:8px 0 10px">${win ? "Who pointed at " + GN.esc(win) + "?" : "Who got the most fingers?"}</h2>
      ${!win ? `<div class="sidegrid">${G.players.map((p, i) => `<button class="sidebtn" data-w="${GN.esc(p)}" style="--sc:${GN.color(i)}">${GN.esc(p)}</button>`).join("")}</div>
        <div class="btns"><button class="btn ghost" id="mess">Total tie, skip it</button></div>`
      : `<div class="sidegrid">${G.players.filter(p => p !== win).map(p => `<button class="sidebtn" data-p="${GN.esc(p)}" style="--sc:${GN.color(G.players.indexOf(p))}" aria-pressed="${pointers.has(p)}">${GN.esc(p)}</button>`).join("")}</div>
        <div class="btns two"><button class="btn" id="back">← Back</button><button class="btn primary" id="ok">Score it</button></div>`}</div>`);
    GN.$$("[data-w]").forEach(b => b.onclick = () => { win = b.dataset.w; GN.sfx.tap(); draw(); });
    GN.$$("[data-p]").forEach(b => b.onclick = () => { const p = b.dataset.p; pointers.has(p) ? pointers.delete(p) : pointers.add(p); GN.sfx.tap(); draw(); });
    if (GN.$("#mess")) GN.$("#mess").onclick = () => { G.n++; next(); };
    if (GN.$("#back")) GN.$("#back").onclick = () => { win = null; pointers.clear(); draw(); };
    if (GN.$("#ok")) GN.$("#ok").onclick = () => {
      pointers.forEach(p => award(p, 1));
      const hit = cfg.predict && R.pred === win; if (hit) award(R.seer, 2);
      (G.book[win] = G.book[win] || []).push(R.P);
      G.n++; GN.sfx.win(); GN.confetti();
      GN.stage(`<div class="wrap" style="width:100%">
        <div class="pre">Most likely to ${GN.esc(R.P)}</div>
        <div class="winner" style="--sc:${GN.color(G.players.indexOf(win))}">${GN.esc(win)}</div>
        <p class="muted">${pointers.size} read the room (+1 each).${cfg.predict ? (hit ? ` 🔮 ${GN.esc(R.seer)} called it! +2` : ` 🔮 ${GN.esc(R.seer)} guessed ${GN.esc(R.pred)}.`) : ""}</p>
        <div class="card" style="text-align:left">${GN.board(G.sides, G.scores, { sort:true })}</div>
        <div class="btns"><button class="btn primary big" id="nx">${G.n >= cfg.rounds ? "Open the yearbook 📖" : "Next prompt"}</button></div></div>`);
      GN.$("#nx").onclick = next;
    };
  };
  draw();
}
function yearbook(){
  const ppl = G.players.filter(p => G.book[p]).sort((a, b) => G.book[b].length - G.book[a].length);
  GN.stage(`<div class="wrap" style="width:100%">
    <div class="kicker">Class of tonight</div><h1 style="font-size:46px;margin:6px 0 16px">The Yearbook</h1>
    <div class="yb">${ppl.map(p => `<div class="p" style="--sc:${GN.color(G.players.indexOf(p))}"><b>${GN.esc(p)}</b><ul>${G.book[p].map(x => `<li>Most likely to ${GN.esc(x)}</li>`).join("")}</ul></div>`).join("")}
      ${G.players.filter(p => !G.book[p]).length ? `<p class="small muted">Mysteriously unsuspicious: ${G.players.filter(p => !G.book[p]).map(GN.esc).join(", ")}</p>` : ""}</div>
    <div class="btns"><button class="btn primary big" id="ok">Final scores 🏆</button></div></div>`);
  GN.$("#ok").onclick = () => GN.finish({ gameId:"mostlikely", gameName:"Most Likely To", sides:G.sides, scores:G.scores, onRematch:start, note:"Points for reading the room." });
}
setup();
</script>
</body>
</html>
