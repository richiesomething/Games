<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronology · Parlor</title>
<meta name="theme-color" content="#14111f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/parlor.css">
<style>
.ev{font-family:var(--display);font-weight:700;font-size:clamp(22px,6vw,30px);line-height:1.15}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-bottom:6px}
.tl{display:flex;flex-direction:column;gap:0;text-align:left;margin-top:12px}
.tl .item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.tl .item .y{font-family:var(--display);font-weight:800;font-size:20px;color:var(--acc);min-width:70px;font-variant-numeric:tabular-nums}
.tl .item .e{font-weight:600;font-size:15px;line-height:1.3}
.tl .item.new{outline:3px solid var(--good)}
.tl .item.bad{outline:3px solid var(--bad)}
.gap{border:2px dashed var(--line);border-radius:12px;margin:5px 0;padding:8px;font-weight:800;color:var(--mute);font-size:14px}
.gap:hover,.gap:focus-visible{border-color:var(--acc);color:var(--acc)}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--sc)}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="../assets/data/chronology.js"></script>
<script src="../assets/js/parlor.js"></script>
<script>
const app = GN.page({ title:"Chronology", accent:"#ffb84d", accentInk:"#2a1700" });
const EVENTS = (window.GN_DATA && GN_DATA.events) || [];
const TAGS = { history:"🏛️ History", science:"🔬 Science", tech:"💡 Tech", culture:"🎭 Culture", sports:"🏅 Sports", music:"🎵 Music", film:"🎬 Film & TV", food:"🍽️ Food", business:"💼 Business", space:"🚀 Space" };
const cfg = Object.assign({ target:7, steal:true }, GN.get("chronology.cfg", {}));
const save = () => GN.set("chronology.cfg", cfg);
const yr = y => y < 0 ? `${-y} BC` : String(y);
let G = null;

function setup(){
  GN.render(`<div class="stack">
    <div><div class="kicker">History · gut instinct</div><h1>Chronology</h1>
    <p class="lede">Every side builds its own timeline. Draw an event and slot it in where you think it belongs. Right, and it stays. Wrong, and it's gone. Which came first, the fax machine or the American Civil War?</p></div>
    <div id="roster"></div>
    <div class="card">
      <h3>Settings</h3>
      <div class="setting"><div class="lab">Cards to win<small>Including your starting card.</small></div>${GN.seg("target", [5, 7, 9, 11], cfg.target)}</div>
      <div class="setting"><div class="lab">Steals<small>Miss, and the next side can try to place that event in <i>their</i> timeline.</small></div>${GN.seg("steal", [true, false], cfg.steal, v => v ? "On" : "Off")}</div>
    </div>
    <button class="btn primary big block" id="go">Deal starting cards</button>
    <details class="card rules"><summary>Rules</summary>
      <ol>
        <li>Each side starts with one event, year showing.</li>
        <li>On your turn, an event is drawn with its year hidden. Tap the gap where it fits in your timeline.</li>
        <li>Correct: it joins your timeline. Wrong: it's discarded${cfg.steal ? ", unless the next side steals it" : ""}.</li>
        <li>When someone reaches ${cfg.target} cards, finish the lap so everyone gets equal turns. Most cards wins.</li>
        <li>Same-year events can go either way round. ${EVENTS.length} events from ancient Rome to 2024.</li>
      </ol>
    </details>
  </div>`);
  GN.rosterBlock(GN.$("#roster"));
  GN.bindSegs(app, cfg, () => { save(); setup(); });
  GN.$("#go").onclick = start;
}
function start(){
  const sides = GN.sides(); if (sides.length < 2) return GN.toast("Need at least 2 sides");
  G = { sides, lines:sides.map(() => []), turn:0, dealer:GN.dealer("chronology", EVENTS, e => e.e), ending:false };
  // spread starting cards across eras so timelines feel different
  sides.forEach((_, i) => G.lines[i].push(G.dealer.next()));
  GN._wantWake = true; GN.wake(true);
  GN.stage(`<div class="wrap" style="width:100%"><div class="kicker">Starting cards</div>
    <div class="tl">${sides.map((s, i) => `<div class="item" style="border-left:5px solid ${s.color}"><span class="y">${yr(G.lines[i][0].y)}</span><span class="e"><b>${GN.esc(s.name)}</b><br>${GN.esc(G.lines[i][0].e)}</span></div>`).join("<div style='height:6px'></div>")}</div>
    <div class="btns"><button class="btn primary big" id="ok">Let's play</button></div></div>`);
  GN.$("#ok").onclick = turn;
}
const counts = () => G.lines.map(l => l.length);
function turn(){
  const si = G.turn % G.sides.length;
  if (si === 0 && G.ending) return end();
  place(si, G.dealer.next(), false);
}
function place(si, ev, stealing){
  const s = G.sides[si], line = G.lines[si].slice().sort((a, b) => a.y - b.y);
  const gaps = line.length + 1;
  const label = k => k === 0 ? `Before ${yr(line[0].y)}` : k === line.length ? `After ${yr(line[line.length - 1].y)}` : `Between ${yr(line[k - 1].y)} and ${yr(line[k].y)}`;
  GN.stage(`<div class="wrap" style="width:100%">
    <div class="row between"><span>${GN.sidePill(s)}</span><span class="kicker">${stealing ? "🦝 Steal attempt!" : `${line.length} / ${cfg.target} cards`}</span></div>
    <div class="prog" style="--sc:${s.color};margin:10px 0">${Array.from({ length:cfg.target }, (_, k) => `<i class="${k < line.length ? "on" : ""}"></i>`).join("")}</div>
    <div class="bigcard" style="margin:12px 0;padding:22px 18px"><div class="tag">${TAGS[ev.t] || ""}</div><div class="ev">${GN.esc(ev.e)}</div></div>
    <div class="small muted">${stealing ? "The last side missed it. Place it in your own timeline:" : "Where does it go?"}</div>
    <div class="tl">${Array.from({ length:gaps }, (_, k) => `<button class="gap" data-k="${k}">↳ ${label(k)}</button>${k < line.length ? `<div class="item"><span class="y">${yr(line[k].y)}</span><span class="e">${GN.esc(line[k].e)}</span></div>` : ""}`).join("")}</div></div>`);
  GN.$$(".gap").forEach(b => b.onclick = () => judge(si, ev, line, +b.dataset.k, stealing));
}
function judge(si, ev, line, k, stealing){
  const lo = k === 0 ? -Infinity : line[k - 1].y, hi = k === line.length ? Infinity : line[k].y;
  const ok = ev.y >= lo && ev.y <= hi;
  const s = G.sides[si];
  if (ok) { G.lines[si].push(ev); GN.sfx.good(); } else GN.sfx.bad();
  const shown = (ok ? [...line, ev] : [...line, ev]).sort((a, b) => a.y - b.y);
  if (G.lines[si].length >= cfg.target) G.ending = true;
  const canSteal = !ok && !stealing && cfg.steal && G.sides.length > 1;
  const nextSi = (si + 1) % G.sides.length;
  const stealer = stealing ? null : nextSi;
  GN.stage(`<div class="wrap" style="width:100%">
    <div style="font-size:54px">${ok ? "✅" : "❌"}</div>
    <h2 style="margin:4px 0">${ok ? "Nailed it" : "Not quite"}: ${yr(ev.y)}</h2>
    <p class="muted" style="margin:0">${GN.esc(ev.e)}</p>
    <div class="tl">${shown.map(x => `<div class="item${x === ev ? (ok ? " new" : " bad") : ""}" style="margin:3px 0"><span class="y">${yr(x.y)}</span><span class="e">${GN.esc(x.e)}</span></div>`).join("")}</div>
    ${G.ending && ok && G.lines[si].length >= cfg.target ? `<p class="note" style="margin-top:12px">${GN.esc(s.name)} reached ${cfg.target}! Finishing this lap so everyone gets the same number of turns.</p>` : ""}
    <div class="card" style="text-align:left;margin-top:12px">${GN.board(G.sides, counts(), { up:si })}</div>
    <div class="btns">${canSteal ? `<button class="btn primary big" id="steal">${GN.esc(G.sides[stealer].name)}: try to steal it</button><button class="btn" id="nx">No steal, next turn</button>` : `<button class="btn primary big" id="nx">Next turn</button>`}</div></div>`);
  const advance = () => { G.turn = stealing ? G.turn : G.turn; G.turn++; turn(); };
  GN.$("#nx").onclick = () => stealing ? (G.turn++, turn()) : advance();
  if (canSteal) GN.$("#steal").onclick = () => place(stealer, ev, true);
}
function end(){ GN.finish({ gameId:"chronology", gameName:"Chronology", sides:G.sides, scores:counts(), onRematch:start, note:"Score = cards in your timeline." }); }
setup();
</script>
</body>
</html>
