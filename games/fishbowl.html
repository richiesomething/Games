<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fishbowl · Parlor</title>
<meta name="theme-color" content="#14111f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/parlor.css">
<style>
.roundcard{border-radius:20px;padding:16px;background:var(--panel2);border:1px solid var(--line);text-align:left}
.roundcard .num{font-family:var(--display);font-weight:800;font-size:40px;color:var(--acc);line-height:1}
.decks{display:flex;flex-wrap:wrap;gap:6px}
.play .hud{display:flex;justify-content:space-between;width:100%;max-width:560px;align-items:center;font-weight:800}
.play .bigcard{width:100%;max-width:560px;margin:18px 0}
.guessers{width:100%;max-width:560px}
.entry{display:grid;gap:8px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="../assets/data/decks_a.js"></script>
<script src="../assets/data/decks_b.js"></script>
<script src="../assets/js/parlor.js"></script>
<script>
const app = GN.page({ title:"Fishbowl", accent:"#4cc9f0", accentInk:"#032634" });
const DECKS = (window.GN_DATA && GN_DATA.decks || []).filter(d => d.cards && d.cards.length);
const ROUNDS = [
  { n:"Describe it", e:"🗣️", r:"Say anything except the name itself. No spelling it out, no “sounds like”, no first letters." },
  { n:"One word", e:"☝️", r:"Exactly one word per card. You can repeat it, point and make faces, but say nothing else." },
  { n:"Charades", e:"🎭", r:"No words and no sounds. Act it out. Everyone has seen these cards twice now, so you can lean on the jokes." },
  { n:"Sounds only", e:"🎵", r:"Bonus round. Make noises, hum or beatbox, but no real words. Stand still with your hands behind your back." },
];
const cfg = Object.assign({ source:"write", per:4, len:60, fourth:false, passes:1, decks:DECKS.filter(d => d.q20).map(d => d.id) }, GN.get("fishbowl.cfg", {}));
const save = () => GN.set("fishbowl.cfg", cfg);
let G = null;

function setup(){
  const n = GN.roster().players.length;
  GN.render(`<div class="stack">
    <div><div class="kicker">Teams · three rounds · loud</div><h1>Fishbowl</h1>
    <p class="lede">Everyone adds names to the bowl. In round one you describe them. In round two you get one word. In round three it's charades. By then everyone knows the cards and has the inside jokes to work with.</p></div>
    <div id="roster"></div>
    <div class="card">
      <h3>The bowl</h3>
      <div class="setting"><div class="lab">Where the cards come from<small id="srcHint"></small></div>${GN.seg("source", ["write", "mix", "decks"], cfg.source, v => ({ write:"We write them", mix:"Half & half", decks:"Draw from decks" })[v])}</div>
      <div class="setting"><div class="lab">Cards per player<small>${n} players × ${cfg.per} = ${n * cfg.per} cards</small></div>${GN.seg("per", [3, 4, 5, 6], cfg.per)}</div>
      <div id="deckpick" ${cfg.source === "write" ? "hidden" : ""}><div class="setting" style="display:block"><div class="lab" style="margin-bottom:8px">Decks to draw from</div><div class="decks">${DECKS.map(d => `<button class="chip" data-d="${d.id}" aria-pressed="${cfg.decks.includes(d.id)}">${d.emoji} ${GN.esc(d.name)}</button>`).join("")}</div></div></div>
    </div>
    <div class="card">
      <h3>Turns</h3>
      <div class="setting"><div class="lab">Turn length</div>${GN.seg("len", [45, 60, 75], cfg.len, v => v + "s")}</div>
      <div class="setting"><div class="lab">Passes per turn<small>A passed card goes back in the bowl.</small></div>${GN.seg("passes", [0, 1, 2], cfg.passes)}</div>
      <div class="setting"><div class="lab">Bonus 4th round<small>Sounds only. No words, no gestures.</small></div>${GN.seg("fourth", [false, true], cfg.fourth, v => v ? "On" : "Off")}</div>
    </div>
    <div class="grid" style="display:grid;gap:8px">${ROUNDS.slice(0, cfg.fourth ? 4 : 3).map((r, i) => `<div class="roundcard"><div class="row"><span class="num">${i + 1}</span><b>${r.e} ${r.n}</b></div><div class="small muted" style="margin-top:4px">${r.r}</div></div>`).join("")}</div>
    <button class="btn primary big block" id="go">Fill the bowl</button>
    <details class="card rules"><summary>Rules & tips</summary>
      <p><b>Teams of 2.</b> Partners take turns. One gives clues, the other guesses, and you swap each turn. Teams alternate.</p>
      <p><b>Individuals.</b> The clue-giver describes and anyone can shout. Tap whoever guessed it: <b>they get a point and so does the clue-giver.</b></p>
      <p><b>The bowl.</b> When the bowl runs out, the round is over. All cards go back in for the next round. If you empty the bowl with time left, you start the next round with what's left of your clock.</p>
      <p><b>Writing cards.</b> Famous people, characters, places or things, and in-jokes from your group. Make them something most people in the room would know.</p>
    </details>
  </div>`);
  GN.rosterBlock(GN.$("#roster"), { onChange:setup });
  GN.bindSegs(app, cfg, () => { save(); setup(); });
  GN.$$("[data-d]").forEach(b => b.onclick = () => { const id = b.dataset.d; cfg.decks = cfg.decks.includes(id) ? cfg.decks.filter(x => x !== id) : [...cfg.decks, id]; if (!cfg.decks.length) cfg.decks = [id]; save(); b.setAttribute("aria-pressed", cfg.decks.includes(id)); });
  GN.$("#srcHint").textContent = { write:"Everyone secretly types their cards on this phone.", mix:"Everyone writes half; the rest are drawn from decks.", decks:"Skip the writing and start right away." }[cfg.source];
  GN.$("#go").onclick = start;
}

function start(){
  const sides = GN.sides(), players = GN.roster().players;
  if (sides.length < 2) return GN.toast("Need at least 2 sides");
  G = { sides, players, scores:sides.map(() => 0), pscores:{}, rot:GN.rotation(sides), cards:[], round:0, bowl:[], carry:0, nRounds:cfg.fourth ? 4 : 3 };
  const written = cfg.source === "write" ? cfg.per : cfg.source === "mix" ? Math.ceil(cfg.per / 2) : 0;
  const fromDeck = players.length * cfg.per - players.length * written;
  if (fromDeck > 0) {
    const pool = DECKS.filter(d => cfg.decks.includes(d.id)).flatMap(d => d.cards.map(c => c[0]));
    G.cards.push(...GN.deal("fishbowl", pool, fromDeck));
  }
  GN._wantWake = true; GN.wake(true);
  if (written) collect(0, written); else beginRound();
}
function collect(pi, k){
  if (pi >= G.players.length) return beginRound();
  const p = G.players[pi];
  GN.handoff({ to:p, emoji:"✍️", color:GN.color(pi), msg:`Secretly write ${k} card${k > 1 ? "s" : ""} for the bowl. Pick names most of the room will know.`, button:"Write my cards", onReady:() => {
    const sugg = GN.shuffle(DECKS.filter(d => d.q20).flatMap(d => d.cards.map(c => c[0]))).slice(0, 3);
    const el = GN.stage(`<div class="wrap" style="width:100%;text-align:left">
      <div class="kicker">${GN.esc(p)} · secret</div><h2 style="margin:6px 0 12px">Your cards for the bowl</h2>
      <div class="entry">${Array.from({ length:k }, (_, i) => `<input class="input" data-k="${i}" maxlength="40" autocomplete="off" autocapitalize="words" placeholder="Card ${i + 1}" enterkeyhint="${i === k - 1 ? "done" : "next"}">`).join("")}</div>
      <p class="tiny muted">Stuck? Try ${sugg.map(GN.esc).join(", ")}… <button class="link tiny" id="fill">Fill blanks for me</button></p>
      <div class="btns"><button class="btn primary big" id="done" disabled>Into the bowl 🐟</button></div></div>`);
    const ins = GN.$$("input", el); const check = () => GN.$("#done").disabled = ins.some(i => !i.value.trim());
    ins.forEach((inp, i) => { inp.oninput = check; inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); (ins[i + 1] || inp).focus(); if (!ins[i + 1]) inp.blur(); } }; });
    GN.$("#fill").onclick = () => { const pool = DECKS.filter(d => d.q20).flatMap(d => d.cards.map(c => c[0])); ins.forEach(i => { if (!i.value.trim()) i.value = GN.pick(pool); }); check(); };
    GN.$("#done").onclick = () => {
      const have = new Set(G.cards.map(GN.norm));
      ins.forEach(i => { let v = i.value.trim(); if (have.has(GN.norm(v))) return; have.add(GN.norm(v)); G.cards.push(v); });
      GN.sfx.good(); collect(pi + 1, k);
    };
    setTimeout(() => ins[0].focus(), 80);
  } });
}

function beginRound(){
  G.bowl = GN.shuffle(G.cards);
  const R = ROUNDS[G.round];
  GN.stage(`<div class="wrap" style="width:100%">
    <div class="kicker">Round ${G.round + 1} of ${G.nRounds}</div>
    <div style="font-size:70px;margin:8px 0">${R.e}</div>
    <h1 style="font-size:clamp(40px,11vw,60px)">${R.n}</h1>
    <p class="lede" style="margin:12px auto">${R.r}</p>
    <p class="muted">${G.cards.length} cards in the bowl.</p>
    ${G.round ? `<div class="card" style="text-align:left;margin-top:14px">${GN.board(G.sides, G.scores, { sort:true })}</div>` : ""}
    <div class="btns"><button class="btn primary big" id="go">Let's go</button></div></div>`);
  GN.$("#go").onclick = turnIntro;
}
function turnIntro(){
  const si = G.rot.side(), s = G.sides[si], cluer = G.rot.member(si), partner = G.rot.partner(si);
  const secs = G.carry > 5 ? Math.ceil(G.carry) : cfg.len; G.carry = 0;
  GN.handoff({ to:cluer, color:s.color, emoji:ROUNDS[G.round].e,
    msg:`${partner ? `You're giving clues to <b>${GN.esc(partner)}</b>.` : "You're giving clues. Anyone can shout it out."}<br>Round ${G.round + 1}: <b>${ROUNDS[G.round].n}</b>. ${secs !== cfg.len ? `<br>You have <b>${secs}s</b> left over from last round.` : ""}<br><span class="small">${G.bowl.length} cards left in the bowl</span>`,
    button:"Start the clock", onReady:() => GN.countdown(ROUNDS[G.round].n, "", () => play(si, cluer, partner, secs)) });
}
function play(si, cluer, partner, secs){
  const s = G.sides[si]; let got = [], passes = 0, card = G.bowl.pop(), T = null, busy = false;
  const solo = !partner;
  const others = solo ? G.players.filter(p => p !== cluer) : [];
  const el = GN.stage(`<div class="play" style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div class="hud"><span>${GN.esc(s.name)} · <span id="cnt">0</span></span><span class="clock" id="clk" style="font-size:34px">${secs}</span><span class="small muted">${ROUNDS[G.round].e} ${ROUNDS[G.round].n}</span></div>
    <div class="tbar" style="width:100%;max-width:560px;margin-top:8px"><i id="bar"></i></div>
    <div class="bigcard"><div class="meta">${G.bowl.length + 1} in the bowl</div><div class="word" id="word"></div></div>
    ${solo ? `<div class="guessers"><div class="small muted" style="margin-bottom:8px">Who got it? Tap them.</div><div class="sidegrid">${others.map((p, i) => `<button class="sidebtn" data-p="${GN.esc(p)}" style="--sc:${GN.color(G.players.indexOf(p))}">${GN.esc(p)}</button>`).join("")}</div></div>`
      : `<button class="btn good big block" id="ok" style="max-width:560px;width:100%">Got it ✓</button>`}
    <div class="row" style="margin-top:14px;justify-content:center"><button class="btn sm" id="pass" ${cfg.passes ? "" : "hidden"}>Pass (${cfg.passes} left)</button><button class="btn sm ghost" id="pause">Pause</button></div></div>`);
  const show = () => { GN.$("#word").textContent = card; GN.$(".meta", el).textContent = (G.bowl.length + 1) + " in the bowl"; };
  show();
  const scored = guesser => {
    if (busy || !card) return; busy = true;
    got.push({ card, guesser }); GN.sfx.good(); GN.vibe(40);
    G.scores[si]++; if (solo && guesser) { const gs = GN.sideOfPlayer(G.sides, guesser); if (gs) G.scores[G.sides.indexOf(gs)]++; }
    GN.$("#cnt").textContent = got.length;
    if (!G.bowl.length) { card = null; G.carry = T.left; T.stop(); return roundOver(si, got); }
    card = G.bowl.pop(); show(); setTimeout(() => busy = false, 250);
  };
  if (solo) GN.$$("[data-p]", el).forEach(b => b.onclick = () => scored(b.dataset.p)); else GN.$("#ok").onclick = () => scored(null);
  GN.$("#pass").onclick = () => { if (passes >= cfg.passes || !G.bowl.length) return GN.toast(G.bowl.length ? "No passes left" : "Last card, no passing!"); passes++; G.bowl.unshift(card); card = G.bowl.pop(); GN.sfx.pass(); show(); GN.$("#pass").textContent = `Pass (${cfg.passes - passes} left)`; };
  GN.$("#pause").onclick = () => { if (T.paused) { T.resume(); GN.$("#pause").textContent = "Pause"; } else { T.pause(); GN.$("#pause").textContent = "Resume"; } };
  T = GN.timer({ seconds:secs, onTick:left => { const c = GN.$("#clk"); if (!c) return; c.textContent = Math.ceil(left); c.classList.toggle("low", left <= 10); GN.$("#bar").style.width = (left / secs * 100) + "%"; },
    onEnd:() => { GN.sfx.buzz(); GN.vibe(300); if (card) G.bowl.push(card); G.bowl = GN.shuffle(G.bowl); G.carry = 0; turnSummary(si, got); } });
}
function turnSummary(si, got){
  GN.stage(`<div class="wrap" style="width:100%">
    <div class="kicker">Time!</div><div class="display" style="font-size:80px;color:var(--acc)">+${got.length}</div>
    <p class="muted">${got.length ? got.map(g => GN.esc(g.card) + (g.guesser ? ` <span class="tiny">(${GN.esc(g.guesser)})</span>` : "")).join(" · ") : "Nothing this time."}</p>
    <p><b>${G.bowl.length}</b> card${G.bowl.length === 1 ? "" : "s"} left in round ${G.round + 1}.</p>
    <div class="card" style="text-align:left">${GN.board(G.sides, G.scores, { up:si })}</div>
    <div class="btns"><button class="btn primary big" id="next">Next turn</button></div></div>`);
  GN.$("#next").onclick = () => { G.rot.advance(); turnIntro(); };
}
function roundOver(si, got){
  GN.sfx.win();
  const last = G.round + 1 >= G.nRounds;
  GN.stage(`<div class="wrap" style="width:100%">
    <div style="font-size:60px">🫙</div><div class="kicker">The bowl is empty</div><h2 style="margin:6px 0">Round ${G.round + 1} complete</h2>
    <p class="muted">${GN.esc(G.sides[si].name)} cleared the last ${got.length} card${got.length === 1 ? "" : "s"}${!last && G.carry > 5 ? ` and keeps <b>${Math.ceil(G.carry)}s</b> for round ${G.round + 2}` : ""}.</p>
    <div class="card" style="text-align:left">${GN.board(G.sides, G.scores, { sort:true })}</div>
    <div class="btns"><button class="btn primary big" id="next">${last ? "Final scores 🏆" : "On to round " + (G.round + 2)}</button></div></div>`);
  GN.$("#next").onclick = () => {
    if (last) return GN.finish({ gameId:"fishbowl", gameName:"Fishbowl", sides:G.sides, scores:G.scores, onRematch:start });
    G.round++; if (G.carry <= 5) { G.carry = 0; G.rot.advance(); } beginRound();
  };
}
setup();
</script>
</body>
</html>
